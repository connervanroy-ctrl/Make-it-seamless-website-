<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Make it seamless</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f00'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Alpina Fine";src:url(fonts/GT-Alpina-Fine-Extended-Bold-Trial.otf) format("opentype");font-weight:700;font-display:block}
@font-face{font-family:"Alpina Tw";src:url(fonts/GT-Alpina-Typewriter-Regular-Trial.otf) format("opentype");font-display:block}
@font-face{font-family:"America Exp";src:url(fonts/GT-America-Expanded-Light-Trial.otf) format("opentype");font-weight:300;font-display:block}
:root{--zw:#000;--rood:#f00;--wit:#fff;--grijs:#d9d9d9;--fine:"Alpina Fine",Georgia,serif;--tw:"Alpina Tw","Courier New",monospace;--am:"America Exp",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wit);color:var(--zw);font-family:var(--am);font-weight:300;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}

/* ---------- logo ---------- */
.mm{position:absolute;font-family:var(--fine);font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--zw);cursor:pointer;user-select:none;z-index:20}
.mm i{font-style:normal;color:var(--rood)}
.dark .mm{color:var(--wit)}

/* ================= DESK ================= */
#desk{min-height:100vh}
.page{position:relative}
.stage{position:relative;width:1512px;height:982px;overflow:hidden;background:var(--wit)}
.fit{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.fit.dark{background:var(--zw)}
.fit.dark .stage{background:var(--zw)}
.desk-mm{left:8px;top:13px;font-size:74px}

/* pagina 1: QR + carrousel */
.ring{position:absolute;inset:0}
.ring figure{position:absolute;margin:0;width:236px;height:236px;display:flex;align-items:center;justify-content:center;will-change:transform}
.ring img{max-width:100%;max-height:100%;object-fit:contain}
.qr{position:absolute;left:588px;top:453px;width:407px;height:434px;display:flex;align-items:center;justify-content:center;background:var(--wit);z-index:3}
.qr svg{width:380px;height:380px;display:block}

/* pagina 2: raster */
#pGrid .stage{height:auto;min-height:982px;overflow:visible;padding:100px 0 120px}
.grid{display:grid;grid-template-columns:repeat(7,184px);column-gap:20px;row-gap:12px;width:1408px;margin-left:48px}
.tile{position:relative;width:184px;height:195px;display:block;text-align:center}
.tile .ph{width:184px;height:181px;display:flex;align-items:center;justify-content:center}
.tile .ph img{max-width:100%;max-height:100%;object-fit:contain}
.tile .cap{display:block;margin-top:3px;font-size:8px;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .big{position:absolute;left:50%;top:50%;width:279px;height:299px;background:var(--wit);transform:translate(-50%,-50%) scale(.66);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;z-index:10;display:flex;flex-direction:column}
.tile .big .bp{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tile .big .bp img{max-width:100%;max-height:100%;object-fit:contain}
.tile .big .bc{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;font-size:8px;line-height:12px;padding:5px 2px 2px}
.tile .big .bc span:first-child{text-align:left}.tile .big .bc span:last-child{text-align:right}
.tile:hover,.tile:focus-visible{z-index:9;outline:none}
.tile:hover .big,.tile:focus-visible .big{opacity:1;transform:translate(-50%,-50%) scale(1)}
.grid.zoekt .tile img{animation:flick 1.1s steps(1,end) infinite;animation-delay:var(--d)}
@keyframes flick{0%{filter:none}45%{filter:grayscale(1)}}
.tile.uit{display:none}
.grid.leeg .tile img{filter:grayscale(1)}
.grid .tile{animation:inkom .45s both;animation-delay:var(--a,0s)}
@keyframes inkom{from{opacity:0;transform:translateY(8px)}}

/* pagina 3: detail */
.descbox{position:absolute;left:82px;top:481px;width:327px;min-height:421px;background:var(--grijs);padding:20px 20px 24px}
.descbox h2{margin:0 0 12px;font-family:var(--tw);font-weight:400;font-size:14px;line-height:1.2}
.descbox p{margin:0;font-size:10px;line-height:1.55}
.zoom{position:absolute;left:524px;top:100px;width:463px;height:617px;display:flex;align-items:center;justify-content:center}
.zoomwin{position:relative;overflow:hidden;cursor:zoom-in;max-width:100%;max-height:100%}
.zoomwin img{width:100%;height:100%;transition:transform .25s ease-out;transform-origin:50% 50%}
.zoomwin.on img{transform:scale(2.4)}
.patch{position:absolute;display:block;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.patch img{width:100%;height:100%}
.pin{left:1285px;top:783px;width:141px;height:141px}
.pin .pt{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pin .txt{font-family:"Old Standard TT",var(--fine);font-size:31px;fill:var(--wit);transition:fill .25s}
.pin .kop{fill:#121428;transition:fill .25s}
.pin:hover{transform:scale(1.1)}
.pin:hover .txt{fill:var(--zw)}
.pin:hover .kop{fill:var(--wit)}

/* pagina 4: laden */
.pct{position:absolute;left:0;right:0;top:363px;text-align:center;font-family:var(--tw);font-size:36.67px;color:var(--wit);font-variant-numeric:tabular-nums}
.bar{position:absolute;left:296px;top:451px;width:921px;height:149px;border-radius:75px;background:var(--wit);box-shadow:0 0 0 3px #3a0000,0 6px 18px rgba(255,0,0,.25);padding:15px}
.bar .fill{height:100%;width:0;min-width:119px;border-radius:60px;background:repeating-linear-gradient(-45deg,var(--rood) 0 26px,var(--wit) 26px 52px);background-size:73.5px 73.5px;box-shadow:inset 0 0 0 3px var(--rood);animation:streep 1.1s linear infinite;transition:width .4s ease-out}
@keyframes streep{to{background-position:73.5px 0}}

/* pagina 5: resultaat */
.foto{position:absolute;left:461px;top:148px;width:485px;height:754px;background:#e9e9e9;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.meet{position:absolute;inset:0;width:1512px;height:982px;pointer-events:none}
.meet .ml{stroke:var(--rood);stroke-width:4;fill:none;stroke-dasharray:12 9;animation:mars 1.6s linear infinite}
.meet .ld{stroke:var(--rood);stroke-width:4;fill:none}
.meet .draw{stroke-dashoffset:var(--len);animation:teken .9s ease-out forwards;animation-delay:var(--dl)}
@keyframes teken{to{stroke-dashoffset:0}}
@keyframes mars{to{stroke-dashoffset:-42}}
.lab{position:absolute;font-size:14px;line-height:1;white-space:nowrap;opacity:0;animation:verschijn .4s forwards;animation-delay:var(--dl)}
.num{position:absolute;font-size:12px;line-height:1;white-space:nowrap;opacity:0;animation:verschijn .4s forwards;animation-delay:var(--dl)}
.num span{outline:none;border-bottom:1px dotted transparent;min-width:1ch;display:inline-block;cursor:text}
.num span:hover,.num span:focus{border-bottom-color:var(--zw)}
@keyframes verschijn{to{opacity:1}}
.seamp{left:1292px;top:770px;width:138px;height:138px}
.remp{left:74px;top:756px;width:146px;height:146px}
.swap{position:relative}
.swap .h{position:absolute;inset:0;opacity:0;transition:opacity .2s}
.swap .naad{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s}
.swap .naad circle{fill:none;stroke:var(--wit);stroke-width:9;stroke-dasharray:22 15;transform-origin:250px 250px;animation:draai 9s linear infinite;animation-play-state:paused}
.swap:hover .h,.swap:hover .naad{opacity:1}
.swap:hover .naad circle{animation-play-state:running}
@keyframes draai{to{transform:rotate(360deg)}}
.swap:hover{transform:scale(1.04)}

/* pagina 6: maken */
.h40{position:absolute;margin:0;font-family:var(--tw);font-weight:400;font-size:40px;line-height:1}
.tiles5{position:absolute;left:82px;top:224px;display:flex;gap:27px}
.tiles5 .pt5{width:150px;height:179px;background:var(--grijs);display:flex;align-items:center;justify-content:center;padding:14px}
.tiles5 svg{width:100%;height:100%}
.dl{position:absolute;left:836px;top:166px;width:104px;height:26px;background:var(--rood);color:var(--wit);font-size:11px;letter-spacing:0;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.dl:hover{background:var(--zw)}
.dl.bezig{opacity:.6;pointer-events:none}
.matbox{position:absolute;left:1021px;top:100px;width:409px;height:482px;background:var(--grijs)}
.matbox ul{list-style:none;margin:0;padding:0;position:absolute;left:38px;top:130px;width:330px}
.matbox li{position:relative;height:44px;padding-left:37px;font-size:12px;line-height:1.25;display:flex;align-items:flex-start;padding-top:3px}
.matbox li::before{content:"";position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;background:var(--rood)}
.steps{position:absolute;left:205px;top:626px;list-style:none;margin:0;padding:0;width:760px}
.steps li{position:absolute;left:0;display:flex;align-items:center;gap:18px;font-size:12px;line-height:1.3;cursor:pointer;width:760px}
.steps .vk{flex:none;width:37px;height:37px;background:var(--grijs);display:flex;align-items:center;justify-content:center}
.steps .vk svg{width:22px;height:22px;opacity:0;transition:opacity .15s}
.steps li.ok .vk svg{opacity:1}
.steps li.ok span{text-decoration:line-through;text-decoration-color:var(--rood)}

/* ================= TELEFOON ================= */
#phone{position:fixed;inset:0;overflow:hidden}
.fp{position:absolute;inset:0;background:var(--wit)}
.fp.dark{background:var(--zw)}
.ph-mm{left:max(26px,env(safe-area-inset-left));top:calc(30px + env(safe-area-inset-top));font-size:40px}
.mic{position:absolute;left:50%;top:50%;width:min(86vw,58vh);aspect-ratio:1;transform:translate(-50%,-46%);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mic img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .15s}
.mic .w{opacity:0}
.mic.druk .w{opacity:1}.mic.druk .r{opacity:0}
.mic svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mic .ringd{fill:none;stroke:var(--wit);stroke-width:9;stroke-dasharray:30 20;stroke-linecap:butt}
.mic .ringv{fill:none;stroke:var(--rood);stroke-width:6;stroke-linejoin:round}
.len{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:234px;margin-top:-30px}
.len label{display:block;font-family:var(--tw);font-size:14px;color:var(--wit);margin-bottom:20px}
.len input{width:234px;height:67px;border:0;border-radius:12px;background:var(--grijs);font-family:var(--tw);font-size:28px;text-align:center;color:var(--zw);outline:none;-webkit-appearance:none;appearance:none}
.len input:focus{box-shadow:0 0 0 3px var(--rood)}
.camicon{position:absolute;left:50%;top:50%;width:227px;height:227px;transform:translate(-50%,-50%)}
.camicon img{width:100%;height:100%}
.camlive{position:absolute;inset:0;background:var(--zw)}
.camlive video,.camlive canvas,.camlive .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camlive .spiegel{transform:scaleX(-1)}
.silh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.silh path,.silh circle{fill:none;stroke:var(--wit);stroke-width:3;stroke-dasharray:10 8;vector-effect:non-scaling-stroke;transition:stroke .3s}
.silh.ok path,.silh.ok circle{stroke:var(--rood)}
.tel{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--tw);font-size:96px;color:var(--wit);text-shadow:0 2px 12px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.ring figure{transition:none}.bar .fill,.meet .ml{animation:none}}
</style>
</head>
<body>

<!-- ================= DESK ================= -->

  <section class="page fit" id="pQR" data-k="fit"><div class="stage">
    <div class="mm desk-mm" data-home>M<i>M</i></div>

    <div class="qr" id="qr" aria-label="Scan deze code met je telefoon"></div>
  </div></section>

  <section class="page" id="pGrid" data-k="w" hidden><div class="stage">
    <div class="mm desk-mm" data-home>M<i>M</i></div>

  </div></section>

  <section class="page fit" id="pDetail" data-k="fit" hidden><div class="stage">
    <div class="mm desk-mm" data-home>M<i>M</i></div>

        </g>
        <g class="kop"><circle cx="64.5" cy="5.5" r="4.3"/><circle cx="137" cy="66" r="4.3"/><circle cx="134" cy="75.5" r="4.3"/><circle cx="5" cy="78" r="4.3"/></g>
        <g transform="rotate(-14 70 70)"><text class="txt" x="28" y="66">PIN</text><text class="txt" x="74" y="99">IT</text></g>

  <section class="page fit dark" id="pLoad" data-k="fit" hidden><div class="stage">

  <section class="page fit" id="pMake" data-k="fit" hidden><div class="stage">
    <div class="mm desk-mm" data-home>M<i>M</i></div>

    <button class="dl" id="dl">DOWNLOAD</button>
    <div class="tiles5" id="tiles5"></div>
    <div class="matbox"><h2 class="h40" style="left:50px;top:23px">Materiaallijst</h2><ul id="mat"></ul></div>
    <h2 class="h40" style="left:204px;top:538px">STAPPENPLAN</h2>
    <ol class="steps" id="steps"></ol>
  </div></section>
</main>

<!-- ================= TELEFOON ================= -->
<main id="phone" hidden>
  <section class="fp" id="fMic">
    <div class="mm ph-mm">M<i>M</i></div>
    <div class="mic" id="mic" role="button" aria-label="Houd ingedrukt en spreek">
      <img class="r" src="img/mic-red.png" alt=""><img class="w" src="img/mic-white.png" alt="">

      <div class="tel" id="tel" hidden></div>
    </div>
  </section>

<script src="data.js"></script>
<script src="lib/qrcode.js"></script>
<script>
"use strict";
const COLL=window.COLL||[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>String(Math.round(n*2)/2).replace(".",",");
const H=location.hash.match(/^#t-([a-z0-9]{4,8})$/);
const ROLE=H?"telefoon":"desk";
const ALPHA="abcdefghjkmnpqrstuvwxyz23456789";
const newCode=()=>{let c="";for(let i=0;i<5;i++)c+=ALPHA[Math.floor(Math.random()*ALPHA.length)];return c};

/* ================= Koppeling telefoon <-> desk =================
   Openbare MQTT-server (werkt op schoolwifi en mobiele data), met BroadcastChannel voor twee tabbladen op hetzelfde toestel. */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function makeLink(code,role){
  const base="momu-mis/v2/"+code+"/",mine=base+(role==="desk"?"desk":"tel"),theirs=base+(role==="desk"?"tel":"desk"),fotoT=base+"foto";
  const hs={state:[],foto:[]};let last=0,lastFoto=0,client=null,bc=null,dead=false;
  let mySeq=0;const me={};
  const deliver=(kind,d)=>{if(!d||typeof d!=="object")return;
    if(kind==="state"){if(d.seq&&d.seq<=last)return;last=d.seq||last;hs.state.forEach(h=>h(d.p||{}))}
    else{if(d.seq&&d.seq<=lastFoto)return;lastFoto=d.seq||lastFoto;hs.foto.forEach(h=>h(d))}};
  try{bc=new BroadcastChannel("momu-mis-"+code);bc.onmessage=e=>{const m=e.data||{};if(m.to===role)deliver(m.kind,m.d)}}catch(e){}
  const pub=(topic,obj,retain)=>{const txt=JSON.stringify(obj);if(client&&client.connected){try{client.publish(topic,txt,{retain:!!retain,qos:0})}catch(e){}}};
  const other=role==="desk"?"telefoon":"desk";
  const api={
    set(patch){Object.assign(me,patch);const d={seq:Date.now()*10+(++mySeq%10),p:{...me}};pub(mine,d,true);if(bc)try{bc.postMessage({to:other,kind:"state",d})}catch(e){}},
    foto(obj){const d={seq:Date.now(),...obj};pub(fotoT,d,true);if(bc)try{bc.postMessage({to:other,kind:"foto",d})}catch(e){}},
    onState(h){hs.state.push(h)},onFoto(h){hs.foto.push(h)},
    close(){dead=true;try{if(client){client.publish(mine,"",{retain:true});if(role==="desk")client.publish(fotoT,"",{retain:true});setTimeout(()=>client.end(true),300)}}catch(e){}try{bc&&bc.close()}catch(e){}},
    get state(){return me}
  };
  (async()=>{
    try{if(typeof mqtt==="undefined")await loadScript("lib/mqtt.min.js")}catch(e){return}
    if(typeof mqtt==="undefined"||dead)return;
    const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
    for(const url of BROKERS){
      const c=await new Promise(res=>{let c;try{c=mqtt.connect(url,{connectTimeout:6000,reconnectPeriod:0,clean:true,clientId:"momu_"+Math.random().toString(16).slice(2,12)})}catch(e){return res(null)}
        const t=setTimeout(()=>{try{c.end(true)}catch(e){}res(null)},7000);
        c.once("connect",()=>{clearTimeout(t);res(c)});c.once("error",()=>{clearTimeout(t);try{c.end(true)}catch(e){}res(null)})});
      if(c){client=c;break}
    }
    if(!client||dead){if(client)client.end(true);return}
    client.options.reconnectPeriod=2000;
    client.on("message",(t,buf)=>{let d=null;try{const s=buf.toString();d=s?JSON.parse(s):null}catch(e){}
      if(t===theirs)deliver("state",d);else if(t===fotoT&&role==="desk")deliver("foto",d)});
    const sub=()=>{client.subscribe(theirs);if(role==="desk")client.subscribe(fotoT);if(Object.keys(me).length)pub(mine,{seq:Date.now()*10,p:{...me}},true)};
    client.on("connect",sub);sub();
  })();
  addEventListener("pagehide",()=>{if(role==="telefoon")try{client&&client.publish(mine,"",{retain:true})}catch(e){}});
  return api;

  function fitZoom(){const img=$("dImg"),w=$("zoomwin");const go=()=>{const r=Math.min(463/img.naturalWidth,617/img.naturalHeight);w.style.width=img.naturalWidth*r+"px";w.style.height=img.naturalHeight*r+"px"};if(img.complete&&img.naturalWidth)go();else img.onload=go}

  $("remeasure").addEventListener("click",()=>{remeasures++;meting=null;show("load");startLoader()});

/* ======================================================================
   TELEFOON

function startPhone(code){
  $("phone").hidden=false;
  const link=makeLink(code,"telefoon");
  let desk={},qid=0,ronde=0,lengte=null;
  try{lengte=+sessionStorage.getItem("mis-lengte")||null}catch(e){}
  link.set({on:true,speaking:false,lengte,prog:0,ronde:0});
  const fp={mic:$("fMic"),len:$("fLen"),cam:$("fCam")};let cur="mic";
  function showF(p){if(cur===p)return;cur=p;Object.entries(fp).forEach(([k,el])=>el.hidden=k!==p);if(p!=="cam")stopCam();if(p==="len")setTimeout(()=>{try{$("lenIn").focus()}catch(e){}},250);if(p==="cam")resetCam()}
  link.onState(d=>{
    desk=d;if(!d.page)return;
    if(d.page==="einde"){showF("mic");return}
    if(d.page==="load"){if((d.remeasures||0)!==ronde||cur==="mic"){ronde=d.remeasures||0;camState="uit"}showF(lengte?"cam":"len");if(lengte&&cur==="cam"&&camState==="uit")startCam();link.set({prog:lengte?.25:.05,ronde})}
    else if(d.page==="result"){/* telefoon blijft op het camerabeeld */}
    else showF("mic");
  });

  /* ---- microfoon ---- */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=$("mic"),ringd=$("ringd"),ringv=$("ringv");
  let rec=null,listening=false,heard="",partial="",talkUntil=0,downAt=0,toggleMode=false,amp=0,raf=0;
  function waveLoop(t){
    const talking=performance.now()<talkUntil;
    amp+=((talking?16:0)-amp)*.12;
    const R=318,N=160,k=14,ph=t/140;let d="";
    for(let i=0;i<=N;i++){const a=i/N*Math.PI*2,r=R+amp*Math.sin(k*a+ph)*(0.6+0.4*Math.sin(3*a-ph*.7));d+=(i?"L":"M")+(399+Math.cos(a)*r).toFixed(1)+" "+(399+Math.sin(a)*r).toFixed(1)}
    ringv.setAttribute("d",d+"Z");
    if(listening||amp>.3)raf=requestAnimationFrame(waveLoop);
  }
  function setPressed(on){mic.classList.toggle("druk",on);ringd.style.display=on?"none":"";if(on)ringv.removeAttribute("hidden");else ringv.setAttribute("hidden","");if(on){cancelAnimationFrame(raf);raf=requestAnimationFrame(waveLoop)}}
  function startListen(){
    if(listening)return;heard="";partial="";
    setPressed(true);listening=true;link.set({speaking:true});
    if(!SR)return;
    try{
      rec=new SR();rec.lang="nl-BE";rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1;
      rec.onresult=e=>{let it="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)heard+=" "+r[0].transcript;else it+=r[0].transcript}partial=it;talkUntil=performance.now()+700};
      rec.onspeechstart=()=>{talkUntil=performance.now()+900};
      rec.onerror=()=>{};
      rec.onend=()=>{if(listening&&!toggleMode){finish()}else if(listening){try{rec.start()}catch(e){finish()}}};
      rec.start();
    }catch(e){}
  }
  function finish(){
    if(!listening)return;listening=false;toggleMode=false;
    setPressed(false);
    const q=(heard+" "+partial).trim();
    link.set(q?{speaking:false,q,qid:++qid+"-"+Date.now()}:{speaking:false});
  }
  function stopListen(){if(!listening)return;toggleMode=false;if(rec){try{rec.stop()}catch(e){finish()}setTimeout(()=>{if(listening)finish()},1500)}else finish()}
  mic.addEventListener("pointerdown",e=>{e.preventDefault();try{mic.setPointerCapture(e.pointerId)}catch(_){}if(listening&&toggleMode){stopListen();return}downAt=performance.now();startListen()});
  const up=()=>{if(!listening||toggleMode)return;if(performance.now()-downAt<350){toggleMode=true;return}stopListen()};
  mic.addEventListener("pointerup",up);mic.addEventListener("pointercancel",up);
  mic.addEventListener("contextmenu",e=>e.preventDefault());

  /* ---- lengte ---- */
  const lenIn=$("lenIn");let lenTimer=0;
  function takeLen(){const v=parseFloat(lenIn.value.replace(",","."));if(!(v>=100&&v<=230))return false;lengte=Math.round(v);try{sessionStorage.setItem("mis-lengte",lengte)}catch(e){}lenIn.blur();link.set({lengte,prog:.25,ronde});showF("cam");return true}
  lenIn.addEventListener("input",()=>{lenIn.value=lenIn.value.replace(/[^\d.,]/g,"");clearTimeout(lenTimer);if(/^\d{3}$/.test(lenIn.value))lenTimer=setTimeout(takeLen,900)});
  $("lenForm").addEventListener("submit",e=>{e.preventDefault();takeLen()});
  lenIn.addEventListener("blur",()=>{if(cur==="len")takeLen()});

  /* ---- camera + meten ---- */
  let stream=null,pose=null,camState="uit",camRaf=0,okFrames=0,samples=[],countStart=0,lastTs=0,lastGood=null;
  function resetCam(){$("camGo").hidden=false;$("camLive").hidden=true;$("still").hidden=true;$("video").hidden=false;$("tel").hidden=true}
  function drawSilh(){
    /* stippellijn-silhouet: halve contour, gespiegeld */
    const R=[[112,92],[118,104],[150,114],[164,128],[172,176],[180,236],[186,292],[190,318],[178,328],[168,298],[160,240],[152,186],[146,166],[146,222],[142,262],[150,302],[148,362],[142,424],[138,486],[146,508],[110,510],[108,444],[106,364],[100,334]];
    const pts=R.concat(R.slice().reverse().map(([x,y])=>[200-x,y]));
    let d="M"+pts.map(p=>p.join(" ")).join(" L")+"Z";
    $("silhG").innerHTML=`<circle cx="100" cy="50" r="36"/><path d="${d}" stroke-linejoin="round"/>`;
  }
  drawSilh();
  $("camGo").addEventListener("click",startCam);
  async function startCam(){
    $("camGo").hidden=true;$("camLive").hidden=false;$("still").hidden=true;$("video").hidden=false;$("silh").classList.remove("ok");
    camState="start";
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:1280}},audio:false})}
    catch(e){camState="uit";resetCam();return}
    const v=$("video");v.srcObject=stream;try{await v.play()}catch(e){}
    link.set({prog:.32,ronde});
    try{pose=pose||await loadPose()}catch(e){console.error(e);return}
    camState="zoek";okFrames=0;samples=[];link.set({prog:.4,ronde});loop();
  }
  function stopCam(){cancelAnimationFrame(camRaf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(camState!=="klaar")camState="uit"}
  async function loadPose(){
    const m=await import("./mediapipe/vision_bundle.mjs");
    const fs=await m.FilesetResolver.forVisionTasks(new URL("mediapipe/wasm",location.href).href);
    const opts=d=>({baseOptions:{modelAssetPath:new URL("mediapipe/pose_landmarker_lite.task",location.href).href,delegate:d},runningMode:"VIDEO",numPoses:1,outputSegmentationMasks:true});
    try{return await m.PoseLandmarker.createFromOptions(fs,opts("GPU"))}catch(e){return await m.PoseLandmarker.createFromOptions(fs,opts("CPU"))}
  }
  function loop(){
    const v=$("video");cancelAnimationFrame(camRaf);
    const step=()=>{
      if(!stream||camState==="klaar"||camState==="uit")return;
      if(v.readyState>=2&&v.videoWidth){let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;pose.detectForVideo(v,ts,res=>onPose(res,v.videoWidth,v.videoHeight))}
      camRaf=requestAnimationFrame(step);
    };camRaf=requestAnimationFrame(step);
  }
  function onPose(res,W,H){
    const lm=res.landmarks&&res.landmarks[0],silh=$("silh"),tel=$("tel");
    if(!lm){okFrames=0;silh.classList.remove("ok");tel.hidden=true;return}
    const mask=res.segmentationMasks&&res.segmentationMasks[0];
    const m=measureFrom(lm,mask?mask.getAsFloat32Array():null,mask?mask.width:0,mask?mask.height:0,W,H);
    if(!m.ok){okFrames=0;samples=[];silh.classList.remove("ok");tel.hidden=true;if(camState==="tel")camState="zoek";return}
    silh.classList.add("ok");okFrames++;
    if(camState==="zoek"&&okFrames>10){camState="tel";countStart=performance.now();samples=[]}
    if(camState==="tel"){
      samples.push(m);lastGood=m;
      const el=(performance.now()-countStart)/1000,left=3-Math.floor(el);
      link.set({prog:Math.min(.92,.5+el/3*.42),ronde});
      if(left>0){tel.hidden=false;tel.textContent=left}else{tel.hidden=true;finishMeasure(W,H)}
    }
  }
  const med=a=>{a=a.filter(x=>x!=null&&isFinite(x)).sort((p,q)=>p-q);return a.length?a[Math.floor(a.length/2)]:null};
  function finishMeasure(W,H){
    camState="klaar";cancelAnimationFrame(camRaf);
    const v=$("video"),maten={};
    ["arm","schouder","borst","heup","been"].forEach(k=>{const x=med(samples.map(s=>s.maten[k]));if(x)maten[k]=x});
    /* foto bijsnijden rond het lichaam in de verhouding van het fotokader (485 x 754) */
    const g=lastGood.box,ratio=485/754;
    let ch=Math.min(H,(g.y2-g.y1)*H*1.12),cw=ch*ratio;if(cw>W){cw=W;ch=cw/ratio}
    const cx=(g.x1+g.x2)/2*W,cy=(g.y1+g.y2)/2*H;
    let sx=Math.max(0,Math.min(W-cw,cx-cw/2)),sy=Math.max(0,Math.min(H-ch,cy-ch/2));
    const cv=document.createElement("canvas");cv.width=485;cv.height=754;const ctx=cv.getContext("2d");
    ctx.drawImage(v,sx,sy,cw,ch,0,0,485,754);
    const img=cv.toDataURL("image/jpeg",.78);
    const nx=x=>(x*W-sx)/cw,ny=y=>(y*H-sy)/ch,G=lastGood.geo;
    const geo={sh:[nx(G.sh[0]),nx(G.sh[1]),ny(G.sh[2])],ch:[nx(G.ch[0]),nx(G.ch[1]),ny(G.ch[2])],hp:[nx(G.hp[0]),nx(G.hp[1]),ny(G.hp[2])],
      arm:[nx(G.arm[0]),ny(G.arm[1]),ny(G.arm[2])],leg:[nx(G.leg[0]),ny(G.leg[1]),ny(G.leg[2])]};
    /* de desk toont de foto zoals anderen je zien: niet gespiegeld */
    const st=$("still");st.src=img;st.hidden=false;v.hidden=true;$("silh").classList.remove("ok");
    stopCam();camState="klaar";
    link.set({prog:1,ronde});link.foto({img,maten,geo,ronde});
  }
  /* maten uit lichaamspunten en silhouet; geeft ook de lijnen voor de desk (genormaliseerd 0..1 in het camerabeeld) */
  function measureFrom(lm,mask,mw,mh,W,H){
    const vis=i=>lm[i]&&(lm[i].visibility??1)>.5,P=i=>({x:lm[i].x*W,y:lm[i].y*H}),d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    if(![11,12,23,24].every(vis))return{ok:false};
    const feet=[27,28].every(vis)&&Math.max(lm[27].y,lm[28].y)<=.99;
    let top=null;
    if(mask){const nx=Math.round(lm[0].x*mw),band=Math.round(mw*.06);for(let y=0;y<mh&&top==null;y++)for(let x=Math.max(0,nx-band);x<Math.min(mw,nx+band);x++)if(mask[y*mw+x]>.5){top=y/mh*H;break}}
    if(top==null)top=P(0).y-(P(24).y-P(12).y)*.3;
    if(top<H*.01)return{ok:false};
    const hipY=(P(23).y+P(24).y)/2,shY=(P(11).y+P(12).y)/2,torso=hipY-shY,cx=(P(23).x+P(24).x)/2;
    const footY=feet?Math.max(...[27,28,29,30,31,32].filter(vis).map(i=>P(i).y)):null;
    const px=feet?footY-top:(hipY-top)/.52;
    if((feet?px:hipY-top)<H*(feet?.45:.3))return{ok:false};
    const cm=(lengte||170)/px;
    const widthAt=yp=>{if(!mask)return null;const my=Math.round(yp/H*mh),mx=Math.round(cx/W*mw);if(my<0||my>=mh||mask[my*mw+mx]<=.5)return null;let l=mx,r=mx;while(l>0&&mask[my*mw+l-1]>.5)l--;while(r<mw-1&&mask[my*mw+r+1]>.5)r++;return[l/mw,(r+1)/mw]};
    const chY=shY+torso*.28,hpY=hipY+torso*.1;
    const cw=widthAt(chY)||[Math.min(lm[11].x,lm[12].x),Math.max(lm[11].x,lm[12].x)];
    const hw=widthAt(hpY)||[Math.min(lm[23].x,lm[24].x)-.03,Math.max(lm[23].x,lm[24].x)+.03];
    const armOk=[13,15,14,16].every(vis);
    const arm=armOk?((d(P(11),P(13))+d(P(13),P(15)))+(d(P(12),P(14))+d(P(14),P(16))))/2*cm*1.05:null;
    const legOk=[25,27,26,28].every(vis);
    const been=legOk?((d(P(23),P(25))+d(P(25),P(27)))+(d(P(24),P(26))+d(P(26),P(28))))/2*cm*1.04:null;
    const shL=Math.min(lm[11].x,lm[12].x),shR=Math.max(lm[11].x,lm[12].x);
    /* lichaamskader */
    const xs=lm.filter((p,i)=>i>10&&vis(i)).map(p=>p.x);const x1=Math.max(0,Math.min(...xs)-.06),x2=Math.min(1,Math.max(...xs)+.06);
    const y1=Math.max(0,top/H-.03),y2=Math.min(1,(feet?footY:hipY+torso*1.9)/H+.03);
    /* in het beeld links van het lichaam (de desk toont het niet gespiegeld) */
    const wristY=armOk?Math.max(lm[15].y,lm[16].y):hipY/H;
    const geo={sh:[shL,shR,shY/H],ch:[cw[0],cw[1],chY/H],hp:[hw[0],hw[1],hpY/H],
      arm:[Math.max(0,x1+.01),shY/H,wristY],leg:[Math.min(1,x2-.01),hipY/H,feet?footY/H:Math.min(1,(hipY+torso*1.9)/H)]};
    return{ok:true,maten:{schouder:d(P(11),P(12))*cm*1.15,arm,borst:cw&&(cw[1]-cw[0])*W*cm*2.7,heup:hw&&(hw[1]-hw[0])*W*cm*2.7,been},geo,box:{x1,x2,y1,y2}};
  }
}

if(ROLE==="telefoon")startPhone(H[1]);else startDesk();
</script>
